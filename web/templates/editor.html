{{define "content"}}

<div class="editor" data-slug="{{.Post.Slug}}" data-new="{{.IsNew}}">

  <div class="ed-head">
    <input id="title" class="title-input" placeholder="Post ka title..."
           value="{{.Post.Title}}" autocomplete="off">
    <div class="ed-actions">
      <span id="status" class="muted small"></span>
      <label class="check">
        <input type="checkbox" id="published" {{if .Post.Published}}checked{{end}}>
        Publish
      </label>
      {{if not .IsNew}}
        <button class="ghost danger" id="deleteBtn">Delete</button>
      {{end}}
      <button class="btn" id="saveBtn">Save <kbd>Ctrl S</kbd></button>
    </div>
  </div>

  <div class="ed-tags">
    <input id="tags" placeholder="tags: comma se alag karo (jaise: go, hackathon)"
           value="{{.TagString}}" autocomplete="off">
    {{if .Suggested}}
      <div class="suggest">
        <span class="muted small">suggest:</span>
        {{range .Suggested}}
          <button class="tag addtag" type="button" data-tag="{{.}}">+ {{.}}</button>
        {{end}}
      </div>
    {{end}}
  </div>

  <!-- Do panel: left me likho, right me turant dikhe.
       Preview client side pe banta hai, isliye ekdum instant hai. -->
  <div class="split">
    <textarea id="body" class="ed-body" spellcheck="false"
      placeholder="Yahan likhna shuru karo...

Markdown chalta hai. Aur [[dusre post ka naam]] likhoge toh wo link ban jayega.">{{.Post.Body}}</textarea>

    <div id="preview" class="ed-preview post-body"></div>
  </div>

  <div class="ed-foot muted small">
    <span id="wordcount">0 words</span>
    <span class="dot">·</span>
    <span>Ctrl+S se save · preview turant update hota hai</span>
  </div>
</div>

{{end}}

{{define "scripts"}}
<script src="/static/editor.js"></script>
{{end}}
